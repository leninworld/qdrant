name: Qdrant 11646 prerequisite proof (non-counted)

on:
  push:
    branches:
      - diagnostic/qdrant-11646-prereq-v3

permissions:
  contents: read

concurrency:
  group: qdrant-11646-prereq-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_REPOSITORY: qdrant/qdrant
  UPSTREAM_SHA: 52fb736a0c02879d4c643d999afafd657cd9085c
  PROTOC_VERSION: "34.1"

jobs:
  toolchain-closure:
    name: Toolchain closure and versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; upstream pin
      - name: Checkout unmodified upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; upstream pin
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - name: Install minimal nightly (fmt only)
        uses: dtolnay/rust-toolchain@0f1b44df7e9cbb178d781a242338dfa5e243ad7f # nightly; upstream pin
        with:
          toolchain: nightly
          components: rustfmt
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable; upstream pin
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2; upstream pin
        with:
          workspaces: upstream
          save-if: false
      - name: Install mold
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1; upstream pin
      - name: Install nextest
        uses: taiki-e/install-action@3a0adc33ab45d7b9b9da91822dd2b3c0151704be # nextest; upstream pin
        with:
          tool: nextest
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; upstream pin
      - name: Install OS, protoc, and ast-grep prerequisites
        run: bash scripts/prereq-proof.sh install-toolchain upstream evidence/toolchain-closure
      - name: Record every tool version and immutable source identity
        run: bash scripts/prereq-proof.sh toolchain upstream evidence/toolchain-closure
      - name: Upload toolchain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; upstream pin
        with:
          name: qdrant-11646-toolchain-closure
          path: evidence/toolchain-closure
          if-no-files-found: warn

  unmodified-all-features-clippy:
    name: Unmodified all-features clippy (GPU included)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; upstream pin
      - name: Checkout unmodified upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; upstream pin
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable; upstream pin
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2; upstream pin
        with:
          workspaces: upstream
          save-if: false
      - name: Install GPU and lint prerequisites
        run: bash scripts/prereq-proof.sh install-gpu upstream evidence/unmodified-all-features-clippy
      - name: Prove unmodified workspace all-features clippy
        run: bash scripts/prereq-proof.sh gpu-clippy upstream evidence/unmodified-all-features-clippy
      - name: Upload clippy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; upstream pin
        with:
          name: qdrant-11646-unmodified-all-features-clippy
          path: evidence/unmodified-all-features-clippy
          if-no-files-found: warn
